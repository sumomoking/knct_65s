<head>

<div class="content-body">
        <h2>華雀の遊び方</h2>
        <img src="../img/game/faojan.gif" class="small-map"><br>
        <a href="faojan.pdf">新規タブでPDFを閲覧</a><br>
        <iframe src="faojan.pdf" 
        width="100%" 
        height="600px"
        frameborder="0">
        PDFを表示できません。
        <a href="document.pdf">こちらからダウンロード</a>してください。
        </iframe>
    

<div class="copyright-bar">
        <marquee behavior="alternate" scrollamount="20">&copy; 2025 久留米高専1S</marquee>
    </div>

    <div id="page-top-btn">↑</div>
    
    <script>
        // トップへ戻るボタンのスクリプト
        const pageTopBtn = document.getElementById('page-top-btn');
        if (pageTopBtn) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    pageTopBtn.classList.add('show');
                } else {
                    pageTopBtn.classList.remove('show');
                }
            });
            pageTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    </script>
