<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>久留米高専1Sのホームページ</title>
    <link rel="stylesheet" href="newcss.css">
</head>

<body>

    <header class="header">
        <img src="img/header.png" alt="サイトのヘッダー画像" width="1024" height="100">
    </header>

    <div class="marquee-container">
        <marquee behavior="alternate" scrollamount="4">久留米高専1Sのホームページへようこそ！高専祭にも是非お越しください😃</marquee>
        <button id="theme-toggle-btn">ライトモード</button>
    </div>

    <main class="grid-container">
        <div class="grid-item item1">
            <img src="img/top.gif" alt="gif 1" width="1000" height="750">
        </div>
        <div class="grid-item item2">
            <a href="https://twitter.com/knct_65s">
                <img src="img/twitter2.gif" alt="Twitter" width="200" height="100">
            </a>
        </div>
        <div class="grid-item item3">
            <a href="https://instagram.com/knct_65s">
                <img src="img/insta2.gif" alt="Instagram" width="200" height="100">
            </a>
        </div>
        <div class="grid-item item4">
            <a href="https://www.kurume-nct.ac.jp/">
                <img src="img/knct.gif" alt="KNCT" width="200" height="100">
            </a>
        </div>
        <div class="grid-item item5">
            <img src="img/welcome.gif" alt="gif 5">
        </div>
        <div class="grid-item item6">
            <a href="">
                <img src="img/sumaho.gif" alt="gif 6">
            </a>
        </div>
    </main>
    
    <footer class="footer">
        <img src="img/banner.gif" alt="gif 7" width="1024" height="68">
    </footer>

    <div class="content-body">
        <h2>2025年高専祭 1Sの出店の案内</h2>
        <ul class="toc">
            <li><a href="#gaiyo">・概要</a></li>
            <li><a href="#date">・日時</a></li>
            <li><a href="#location">・場所</a></li>
            <li><a href="#content">・ゲームの内容</a></li>
        </ul>

        <h3 id="gaiyo">概要</h3>
        <p>
            概要を書こう
        </p>

        <h3 id="date">日時</h3>
        <p>
            11月2日（<span class="text-red">日</span>）<br>
            11月3日（<span class="text-red">月</span>）※文化の日<br>
            営業時間 0:00~24:00
        </p>

        <h3 id="location">場所</h3>
        <p>
            一般教室棟 2階 203教室<br>
            <span class="text-gray">※正門入って左奥の[久留米高専]の看板がある校舎ですヨ!</span><br>
            <a href="https://www.kurume-nct.ac.jp/">詳細な行き方はコチラ</a>
        </p>
        
        <img src="img/toukamae.jpg" alt="キャンパスマップ">

        <h3 id="content">ゲームの内容</h3>
        <p>
            アビョー
        </p>
    </div>

    <div class="copyright-bar">
        <marquee behavior="alternate" scrollamount="20">&copy; 2025 久留米高専1S</marquee>
    </div>

    <div id="page-top-btn">↑</div>
    
    <script>
        // トップへ戻るボタンのスクリプト
        const pageTopBtn = document.getElementById('page-top-btn');
        if (pageTopBtn) {
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    pageTopBtn.classList.add('show');
                } else {
                    pageTopBtn.classList.remove('show');
                }
            });
            pageTopBtn.addEventListener('click', () => {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }
    </script>
    <script>
        // テーマ切替のスクリプト
        const themeToggleBtn = document.getElementById('theme-toggle-btn');
        const body = document.body;
        if (themeToggleBtn) {
            const updateButtonText = () => {
                if (body.classList.contains('light-mode')) {
                    themeToggleBtn.textContent = 'ダークモード';
                } else {
                    themeToggleBtn.textContent = 'ライトモード';
                }
            };
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                body.classList.add('light-mode');
            }
            updateButtonText();
            themeToggleBtn.addEventListener('click', () => {
                body.classList.toggle('light-mode');
                if (body.classList.contains('light-mode')) {
                    localStorage.setItem('theme', 'light');
                } else {
                    localStorage.setItem('theme', 'dark');
                }
                updateButtonText();
            });
        }
    </script>

</body>
</html>
